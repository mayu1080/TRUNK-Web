<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DB: Pixi探索コア — TRUNK LIST_demo</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
        font-family: ui-monospace, 'Cascadia Code', 'Segoe UI Mono', monospace;
        color: #e0e0e0;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #pixi-host {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      #pixi-host canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #debug-panel {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 10;
        max-width: min(360px, 90vw);
        padding: 10px 12px;
        background: rgba(0, 0, 0, 0.78);
        border: 1px solid #333;
        border-radius: 4px;
        font-size: 11px;
        line-height: 1.45;
        pointer-events: none;
        white-space: pre-wrap;
      }
      #debug-panel .warn { color: #f0c040; }
      #zoom-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(0, 0, 0, 0.55);
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      #zoom-overlay.open { display: flex; }
      #zoom-card {
        background: #f5f5f5;
        color: #111;
        border-radius: 8px;
        padding: 20px;
        max-width: 480px;
        width: 100%;
        max-height: 90vh;
        overflow: auto;
        pointer-events: auto;
      }
      #zoom-card img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 12px 0;
        filter: grayscale(100%);
      }
      #zoom-close {
        margin-top: 12px;
        padding: 8px 16px;
        cursor: pointer;
        border: 1px solid #999;
        background: #fff;
        border-radius: 4px;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        font-size: 14px;
      }
      #loading.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="loading">Loading assets…</div>
    <div id="app">
      <div id="pixi-host"></div>
      <pre id="debug-panel"></pre>
      <div id="zoom-overlay" aria-hidden="true">
        <div id="zoom-card">
          <strong>IMAGE_ZOOM (demo)</strong>
          <p id="zoom-id"></p>
          <img id="zoom-img" alt="" />
          <button type="button" id="zoom-close">Close ×</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
